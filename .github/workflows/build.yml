name: Build Windows binary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RdpDisplayPicker/RdpDisplayPicker.csproj --runtime win-x64

      - name: Publish self-contained executable
        run: >
          dotnet publish RdpDisplayPicker/RdpDisplayPicker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/win-x64
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RdpDisplayPicker-win-x64-${{ github.sha }}
          path: publish/win-x64/RdpDisplayPicker.exe
          if-no-files-found: error
          retention-days: 14
